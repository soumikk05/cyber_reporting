<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Crime Reporting System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-hero">
            <div class="auth-logo">🛡️</div>
            <h1>Crime Reporting<br><span style="color:var(--primary)">System</span></h1>
            <p>// JOIN THE COMMUNITY WATCH</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Create Account</h2>
                <p class="card-subtitle">Register to report and track crime complaints</p>
            </div>

            <div id="alertContainer"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Letters and numbers only"
                        pattern="[a-zA-Z0-9]+" title="Only letters and numbers allowed" required autocomplete="off">
                    <small
                        style="color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:0.75rem; margin-top:0.3rem; display:block;">
                        Only letters (a-z) and numbers (0-9). No spaces or symbols.
                    </small>
                </div>

                <div class="form-group">
                    <label for="email">Official Email ID</label>
                    <input type="email" id="email" name="email" placeholder="Enter your official email ID" required>
                    <small
                        style="color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:0.75rem; margin-top:0.3rem; display:block;">
                        All report confirmations and admin updates will be sent only to this email.
                    </small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min. 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Repeat your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.5rem;">
                    Create Account
                </button>
            </form>

            <div class="auth-link">
                Already registered? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
